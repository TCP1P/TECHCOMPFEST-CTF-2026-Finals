;;;;;;;;;;;;;;;;;;;;;
; Functions & restrictions
;;;;;;;;;;;;;;;;;;;;;

; Your original list + 'show_source', 'highlight_file', 'disk_free_space' to prevent info leaks.
; WARNING: This list blocks file uploads and directory creation.
disable_functions = exec,shell_exec,system,passthru,proc_open,popen,proc_nice,pcntl_exec,pcntl_fork,pcntl_alarm,pcntl_signal,pcntl_signal_dispatch,pcntl_wait,pcntl_waitpid,pcntl_wexitstatus,pcntl_wifexited,pcntl_wifsignaled,pcntl_wifstopped,pcntl_wstopsig,pcntl_getpriority,pcntl_setpriority,curl_exec,curl_multi_exec,assert,ini_set,ini_restore,parse_ini_file,parse_ini_string,getenv,putenv,apache_setenv,apache_getenv,mail,imap_open,dl,fsockopen,pfsockopen,stream_socket_client,stream_socket_server,stream_socket_accept,proc_get_status,proc_terminate,posix_mkfifo,posix_kill,posix_setuid,posix_seteuid,posix_setgid,posix_setegid,symlink,link,linkinfo,readlink,chgrp,chmod,chown,lchgrp,lchown,copy,rename,move_uploaded_file,mkdir,rmdir,show_source,highlight_file,disk_free_space,disk_total_space

; Limit file access to specific directories
open_basedir = /var/www/html:/tmp

; Disable dynamic loading of extensions
enable_dl = Off

;;;;;;;;;;;;;;;;;;;;;
; Remote Access & RCE Prevention
;;;;;;;;;;;;;;;;;;;;;

; Disable opening remote URLs as files (You had this)
allow_url_fopen = Off

; CRITICAL: Disable including remote files (Prevents RFI attacks)
allow_url_include = Off

; CRITICAL for Nginx/FastCGI: Prevents executing "image.jpg/shell.php"
cgi.fix_pathinfo = 0

;;;;;;;;;;;;;;;;;;;;;
; Information Disclosure
;;;;;;;;;;;;;;;;;;;;;

; Hide PHP version headers (You had this)
expose_php = Off

; Never show errors to the end-user (Prevents path disclosure)
display_errors = Off
display_startup_errors = Off

; Log errors to a file instead so you can debug securely
log_errors = On
error_log = /var/log/php_errors.log

;;;;;;;;;;;;;;;;;;;;;
; Session Hardening (Anti-XSS/Hijacking)
;;;;;;;;;;;;;;;;;;;;;

; Prevent JavaScript from accessing session cookies
session.cookie_httponly = 1

; Ensure cookies are only sent over HTTPS (Enable this if you use SSL)
session.cookie_secure = 1

; Prevent session fixation attacks
session.use_strict_mode = 1

; Prevent Cross-Site Request Forgery (CSRF) via cookies
session.cookie_samesite = "Strict"

; Store sessions in a secure location (not /tmp if possible, or ensure /tmp is private)
; session.save_path = "/var/lib/php/sessions"

;;;;;;;;;;;;;;;;;;;;;
; File Uploads
;;;;;;;;;;;;;;;;;;;;;

; If your app doesn't need uploads, turn this off entirely.
; Since you disabled 'move_uploaded_file' above, this should likely be Off.
file_uploads = Off

; If you MUST allow uploads, limit them strictly:
; upload_max_filesize = 2M
; max_file_uploads = 2

;;;;;;;;;;;;;;;;;;;;;
; DoS Prevention (Resource Limits)
;;;;;;;;;;;;;;;;;;;;;

; Limit execution time (seconds)
max_execution_time = 30

; Limit memory usage
memory_limit = 128M

; Limit input variables (Mitigates Hash collision attacks)
max_input_vars = 1000

; Limit POST body size
post_max_size = 8M